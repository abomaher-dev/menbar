<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>شهاداتي | المنبر</title>
    </head>
    <body class="flex min-h-screen flex-col" data-account-page="certificates">
        <div id="site-header"></div>
        <div class="grid flex-1 grid-cols-1 md:grid-cols-[18rem_minmax(0,1fr)]">
            <div id="account-sidebar"></div>
            <main class="min-w-0 px-5 py-8 sm:px-8 md:px-10 lg:px-16">
                <div class="mx-auto max-w-4xl">
                    <h1 class="mb-8 border-b border-primary/40 pb-4 text-2xl font-bold text-text-main">
                        شهاداتي
                    </h1>
                    <div class="flex flex-col gap-3">
                        <details class="border-b border-gray-300">
                            <summary class="flex cursor-pointer list-none items-center justify-between py-3 text-lg font-ruqaa text-text-main [&::-webkit-details-marker]:hidden">
                                التفسير
                                <span class="text-sm font-sans">⌄</span>
                            </summary>
                            <div class="px-4 pb-4 text-text-muted">
                                <p class="mb-2">شهادة إتمام مقرر التفسير</p>
                                <div class="flex flex-wrap gap-4">
                                    <a
                                        href="/books/certificate.pdf"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="font-bold text-primary underline"
                                    >عرض الشهادة</a>
                                    <a
                                        href="/books/certificate.pdf"
                                        download="certificate.pdf"
                                        class="font-bold text-primary underline"
                                    >تحميل الشهادة</a>
                                </div>
                            </div>
                        </details>
                        <details class="border-b border-gray-300">
                            <summary class="flex cursor-pointer list-none items-center justify-between py-3 text-lg font-ruqaa text-text-main [&::-webkit-details-marker]:hidden">
                                الفقه
                                <span class="text-sm font-sans">⌄</span>
                            </summary>
                            <p class="px-4 pb-4 text-text-muted">
                                لا توجد شهادات متاحة لهذا المقرر بعد.
                            </p>
                        </details>
                        <details class="border-b border-gray-300">
                            <summary class="flex cursor-pointer list-none items-center justify-between py-3 text-lg font-ruqaa text-text-main [&::-webkit-details-marker]:hidden">
                                الحديث
                                <span class="text-sm font-sans">⌄</span>
                            </summary>
                            <p class="px-4 pb-4 text-text-muted">
                                لا توجد شهادات متاحة لهذا المقرر بعد.
                            </p>
                        </details>
                        <details class="border-b border-gray-300">
                            <summary class="flex cursor-pointer list-none items-center justify-between py-3 text-lg font-ruqaa text-text-main [&::-webkit-details-marker]:hidden">
                                العقيدة
                                <span class="text-sm font-sans">⌄</span>
                            </summary>
                            <p class="px-4 pb-4 text-text-muted">
                                لا توجد شهادات متاحة لهذا المقرر بعد.
                            </p>
                        </details>
                    </div>
                </div>
            </main>
        </div>
        <script type="module" src="/src/pages/account-layout.js"></script>
    </body>
</html>
