<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>الدعم الأكاديمي | المنبر</title>
    </head>
    <body class="flex min-h-screen flex-col">
        <div id="site-header"></div>
        <main class="decorative-page flex-1">
            <section class="relative z-10 px-4 py-10 sm:px-6 sm:py-12 lg:px-12 lg:py-14">
                <div class="mx-auto mb-8 max-w-4xl text-center">
                    <h1 class="mb-3 text-4xl font-bold text-text-main sm:text-5xl">
                        الدعم الأكاديمي
                    </h1>
                    <p class="text-lg text-text-main sm:text-xl">
                        لا تتردد في طرح أي سؤال أو استفسار وسنقوم بالرد عليك في أقرب وقت ممكن
                    </p>
                </div>
                <div class="mx-auto grid max-w-6xl items-center gap-8 rounded-3xl bg-white p-5 shadow-[0_0_24px_rgba(0,0,0,0.18)] sm:p-8 md:grid-cols-2 md:gap-10 lg:rounded-[3.5rem] lg:p-12">
                    <form id="support-form" class="flex flex-col gap-5">
                        <div class="flex flex-col gap-2">
                            <label for="full-name" class="font-bold text-text-main">الاسم بالكامل</label>
                            <input
                                id="full-name"
                                name="fullName"
                                type="text"
                                autocomplete="name"
                                placeholder="اكتب اسمك بالكامل"
                                required
                                class="h-12 rounded-lg border border-primary/40 px-4 outline-none focus:border-primary"
                            />
                        </div>
                        <div class="flex flex-col gap-2">
                            <label for="email" class="font-bold text-text-main">البريد الإلكتروني</label>
                            <input
                                id="email"
                                name="email"
                                type="email"
                                autocomplete="email"
                                placeholder="اكتب بريدك الإلكتروني"
                                required
                                class="h-12 rounded-lg border border-primary/40 px-4 outline-none focus:border-primary"
                            />
                        </div>
                        <div class="flex flex-col gap-2">
                            <label for="subject" class="font-bold text-text-main">عنوان المشكلة أو الاستفسار</label>
                            <input
                                id="subject"
                                name="subject"
                                type="text"
                                placeholder="اكتب عنوانًا موجزًا"
                                required
                                class="h-12 rounded-lg border border-primary/40 px-4 outline-none focus:border-primary"
                            />
                        </div>
                        <div class="flex flex-col gap-2">
                            <label for="message" class="font-bold text-text-main">تفاصيل المشكلة أو الاستفسار</label>
                            <textarea
                                id="message"
                                name="message"
                                rows="5"
                                placeholder="اكتب التفاصيل هنا"
                                required
                                class="resize-y rounded-lg border border-primary/40 px-4 py-3 outline-none focus:border-primary"
                            ></textarea>
                        </div>
                        <div class="flex flex-wrap items-center justify-between gap-3">
                            <label
                                for="attachment"
                                class="cursor-pointer font-bold text-text-main underline"
                            >إرفاق ملف</label>
                            <span id="attachment-name" class="text-sm text-text-muted">
                                لم يتم اختيار ملف
                            </span>
                            <input
                                id="attachment"
                                name="attachment"
                                type="file"
                                class="sr-only"
                            />
                        </div>
                        <button
                            type="submit"
                            class="h-12 w-full self-center rounded-full bg-primary font-bold text-bg sm:w-56"
                        >
                            أرسل رسالتك
                        </button>
                    </form>
                    <div class="flex justify-center">
                        <img
                            src="/src/assets/images/academic-support.png"
                            alt="تواصل مع فريق الدعم"
                            class="w-full max-w-md object-contain"
                        />
                    </div>
                </div>
            </section>
        </main>
        <div id="site-footer"></div>
        <script type="module" src="/src/pages/academic-support.js"></script>
    </body>
</html>
