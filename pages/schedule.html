<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>الجدول الدراسي | المنبر</title>
    </head>
    <body class="flex min-h-screen flex-col">
        <div id="site-header"></div>
        <main class="decorative-page flex-1 px-4 py-8 sm:px-6 sm:py-10 lg:px-12">
            <section class="relative z-10 mx-auto max-w-6xl">
                <div class="mb-6 text-center sm:mb-8">
                    <h1 class="text-3xl font-bold text-text-main sm:text-4xl lg:text-5xl">
                        الجدول الدراسي
                    </h1>
                    <p class="mx-auto mt-3 max-w-2xl leading-7 text-text-muted">
                        يمكنك الاطلاع على المنهج الدراسي هنا أو تنزيل نسخة PDF للاحتفاظ بها.
                    </p>
                </div>
                <div class="overflow-hidden rounded-lg border border-primary/30 bg-white shadow-lg">
                    <div class="flex flex-col items-stretch justify-between gap-3 border-b border-gray-200 bg-white p-4 sm:flex-row sm:items-center sm:px-6">
                        <h2 class="font-bold text-text-main">ملف المنهج الدراسي (PDF)</h2>
                        <div class="flex flex-col gap-2 sm:flex-row">
                            <a
                                href="/books/curriculum.pdf"
                                target="_blank"
                                rel="noopener"
                                class="inline-flex min-h-11 items-center justify-center rounded-full border border-primary px-5 font-bold text-primary transition-colors hover:bg-gray-100"
                            >
                                فتح في نافذة جديدة
                            </a>
                            <a
                                href="/books/curriculum.pdf"
                                download="curriculum.pdf"
                                class="inline-flex min-h-11 items-center justify-center rounded-full bg-primary px-5 font-bold text-white transition-colors hover:bg-secondary"
                            >
                                تنزيل الجدول
                            </a>
                        </div>
                    </div>
                    <iframe
                        src="/books/curriculum.pdf"
                        title="الجدول الدراسي بصيغة PDF"
                        class="h-[65vh] min-h-[28rem] w-full sm:h-[75vh]"
                    ></iframe>
                    <p class="border-t border-gray-200 px-4 py-3 text-center text-sm text-text-muted">
                        إذا لم يظهر الملف داخل الصفحة، استخدم «فتح في نافذة جديدة» أو «تنزيل الجدول».
                    </p>
                </div>
            </section>
        </main>
        <div id="site-footer"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
