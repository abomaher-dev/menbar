<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>تغيير كلمة المرور | المنبر</title>
    </head>
    <body class="flex min-h-screen flex-col" data-account-page="account">
        <div id="site-header"></div>
        <div class="grid flex-1 grid-cols-1 md:grid-cols-[18rem_minmax(0,1fr)]">
            <div id="account-sidebar"></div>
            <main class="min-w-0 px-5 py-8 sm:px-8 md:px-10 lg:px-16">
                <div class="mx-auto max-w-4xl">
                    <div class="mb-8 border-b border-primary/40 pb-4">
                        <h1 class="text-2xl font-bold text-text-main">تغيير كلمة المرور</h1>
                    </div>
                    <form class="mx-auto flex max-w-2xl flex-col gap-5">
                        <label class="grid gap-2 font-bold sm:grid-cols-[12rem_minmax(0,1fr)] sm:items-center">
                            كلمة المرور القديمة
                            <input
                                type="password"
                                autocomplete="current-password"
                                placeholder="كلمة المرور القديمة"
                                class="h-11 rounded-md border border-gray-400 px-3 font-normal"
                            />
                        </label>
                        <label class="grid gap-2 font-bold sm:grid-cols-[12rem_minmax(0,1fr)] sm:items-center">
                            كلمة المرور الجديدة
                            <input
                                type="password"
                                autocomplete="new-password"
                                placeholder="كلمة المرور الجديدة"
                                class="h-11 rounded-md border border-gray-400 px-3 font-normal"
                            />
                        </label>
                        <label class="grid gap-2 font-bold sm:grid-cols-[12rem_minmax(0,1fr)] sm:items-center">
                            تأكيد كلمة المرور
                            <input
                                type="password"
                                autocomplete="new-password"
                                placeholder="تأكيد كلمة المرور"
                                class="h-11 rounded-md border border-gray-400 px-3 font-normal"
                            />
                        </label>
                        <div class="mt-5 flex flex-wrap justify-center gap-3">
                            <a href="/pages/my-account.html" class="inline-flex h-11 w-40 items-center justify-center rounded-md border border-primary text-primary">
                                إلغاء
                            </a>
                            <button type="button" class="h-11 w-40 rounded-md bg-primary font-bold text-bg">
                                حفظ التغييرات
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
        <script type="module" src="/src/pages/account-layout.js"></script>
    </body>
</html>
